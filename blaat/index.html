
<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vejen til blåt bælte · Arirang</title>
<style>
:root {
  font-family:system-ui,-apple-system,sans-serif;
  color:#182842;
  background:#f3f6fc;
}
* {box-sizing:border-box}
body {margin:0}
header {
  padding:27px 18px;
  background:linear-gradient(120deg,#10223e,#2453b4);
  color:white;
}
header h1 {
  margin:5px 0;
  font-size:clamp(26px,6vw,40px);
}
header p {margin:6px 0;color:#dce8ff}
.wrap {max-width:880px;margin:auto}
nav {
  display:flex;
  overflow:auto;
  background:white;
  border-bottom:1px solid #dce4f0;
  position:sticky;
  top:0;
}
nav button {
  border:0;
  background:white;
  padding:13px;
  white-space:nowrap;
  color:#536480;
  font-weight:700;
}
nav button.on {
  color:#174cbd;
  border-bottom:3px solid #174cbd;
}
main {padding:20px 14px 45px}
.card {
  background:white;
  border:1px solid #dae3f0;
  border-radius:15px;
  padding:17px;
  margin:0 0 13px;
  box-shadow:0 4px 15px #16305a08;
}
.card h3 {margin:0 0 7px}
.muted,small {color:#64748b}
h2 {margin:0 0 10px}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}
.btn {
  border:1px solid #234fb0;
  background:#2453b4;
  color:white;
  border-radius:10px;
  padding:10px 13px;
  margin:4px 6px 4px 0;
  font-weight:700;
}
.btn.alt {
  background:#edf3fd;
  color:#2453b4;
  border-color:#d6e3f5;
}
.btn.chosen {
  background:#d8f6e5;
  color:#166340;
  border-color:#58ac81;
}
button {cursor:pointer;font:inherit}
button:focus-visible {
  outline:3px solid orange;
  outline-offset:2px;
}
.flash {
  min-height:220px;
  display:grid;
  place-content:center;
  text-align:center;
  background:#eaf2ff;
  border-radius:15px;
  padding:25px;
  margin:15px 0;
}
.flash strong {font-size:30px}
.term {
  padding:14px 0;
  border-top:1px solid #e4eaf3;
}
.term:first-of-type {border:0}
.term h3 {margin:0 0 3px;font-size:17px}
.term p {margin:4px 0}
.check {
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 0;
  border-bottom:1px solid #e4eaf2;
}
.check input {
  width:21px;
  height:21px;
  accent-color:#25835f;
}
.option {
  display:block;
  text-align:left;
  background:white;
  color:#182842;
  border:1px solid #d4deeb;
  border-radius:10px;
  padding:13px;
  width:100%;
  margin:8px 0;
}
.option.good {
  background:#d9f5e7;
  border-color:#52ab80;
}
.option.bad {
  background:#ffebeb;
  border-color:#e59a9a;
}
.note {
  background:#fff7e8;
  border-left:4px solid #dfad4a;
  padding:12px;
  margin:15px 0;
  border-radius:6px;
}
.meter {
  background:#e1e8f4;
  border-radius:100px;
  height:9px;
  overflow:hidden;
}
.meter span {
  display:block;
  background:#40a67b;
  height:100%;
}
footer {
  text-align:center;
  font-size:12px;
  color:#67748a;
  padding:24px 14px;
}
@media(max-width:480px) {
  nav button {padding:11px 9px;font-size:13px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>🥋 ARIRANG · HJEMMETRÆNER</div>
    <h1>Vejen til blåt bælte</h1>
    <p>Grønt bælte (7. kup) → Blåt bælte (6. kup)</p>
    <p id="progress"></p>
    <div class="meter">
      <span id="bar" style="width:0%"></span>
    </div>
  </div>
</header>

<nav id="nav">
  <button data-tab="home">Overblik</button>
  <button data-tab="cards">Flashcards</button>
  <button data-tab="tech">Teknikker</button>
  <button data-tab="drills">Øvelser</button>
  <button data-tab="quiz">Miniprøve</button>
</nav>

<main class="wrap" id="view"></main>

<footer>
  Uofficiel studiehjælp baseret på Arirang Taekwon
  Dojangs pensum af 02.06.2024, side 18.
  Trænerens instruktion har altid forrang.
  Fremskridt gemmes kun på enheden.
</footer>

<script>
'use strict';

const words = [
  ['Mit palmok','mit pahl måk',
   'Undersiden af underarmen','blå'],
  ['Me jumeok','me dju måk',
   'Ydersiden af knyttet hånd','blå'],
  ['Palkoop','pahl kop','Albue','blå'],
  ['Dari','dah ri','Ben','blå'],
  ['Mooreup','moo røp','Knæ','blå'],
  ['Pyojeok','pjo jåk','Plet','blå'],
  ['Shijak','sji djak','Begynd / start','grøn'],
  ['Kalyeo','kal jår','Stop','grøn'],
  ['Gyesok','gjæ sok','Fortsæt','grøn'],
  ['Mileo','mi lår','Skubbe','grøn'],
  ['Batangson','bar tang sån','Håndrod','grøn'],
  ['Balbadak','bal ba dak','Fodsål','grøn']
].map((w,i)=>({
  id:'w'+i,
  k:w[0],
  p:w[1],
  d:w[2],
  level:w[3]
}));

const techniques = [
  [
    'Standteknikker',
    'Oreun seogi',
    'o røn så gi',
    'Højre stand'
  ],
  [
    'Standteknikker',
    'Oen seogi',
    'årn så gi',
    'Venstre stand'
  ],
  [
    'Håndteknikker',
    'Me jumeok momtong naeryo chigi',
    'me dju måk mom tong næh ryo tji gi',
    'Nedadgående slag med ydersiden af knyttet hånd'
  ],
  [
    'Håndteknikker',
    'Palkoop dollyo chigi',
    'pahl kop dol ljo tji gi',
    'Cirkelslag med albue'
  ],
  [
    'Håndteknikker',
    'Palkoop pyojeok chigi',
    'pahl kop pjo jåk tji gi',
    'Pletslag med albue'
  ],
  [
    'Håndteknikker',
    'Yeop jireugi',
    'yåp dji rø gi',
    'Sideslag fra hoften med knyttet hånd'
  ],
  [
    'Benteknikker',
    'Biteureo chagi',
    'bit ø rå tja gi',
    'Vridespark'
  ],
  [
    'Benteknikker',
    'Beodeo chagi',
    'bår dår tjar gi',
    'Stempelspark'
  ],
  [
    'Benteknikker',
    'Ieo chagi',
    'i år tjar gi',
    'To ens spark med forskellige ben'
  ],
  [
    'Benteknikker',
    'Seokeo chagi',
    'sår kår tjar gi',
    'To forskellige spark med samme ben'
  ],
  [
    'Benteknikker',
    'Jijjigki',
    'dji tjik gi',
    'Stampe-/trampespark'
  ]
].map((t,i)=>({
  id:'t'+i,
  group:t[0],
  k:t[1],
  p:t[2],
  d:t[3]
}));

const forms = [
  {id:'f0',k:'Taegeuk Sah Jang'},
  {id:'f1',k:'Pyong Cho Dan'}
];

const exercises = [
  {
    id:'one',
    name:'Et-skridtskamp · Han Bon Kireugi',
    count:10,
    desc:'10 stk., 5 med spark og 3 med nedtagning'
  },
  {
    id:'three',
    name:'Tre-skridtskamp · Set Bon Kireugi',
    count:8,
    desc:'8 stk., 4 med spark og 2 med nedtagning'
  },
  {
    id:'def',
    name:'Selvforsvar · Ho Sin Sul',
    count:3,
    desc:'3 frigørelser fra skulder-/brystgreb'
  },
  {
    id:'spar',
    name:'Kamp · Kireugi',
    count:3,
    desc:'3 runder à 2 minutter med fuldt udstyr'
  }
];

const key = 'arirang-blaa-v1';

let saved = {};
try {
  saved = JSON.parse(localStorage.getItem(key)||'{}');
} catch {}

const s = {
  tab:'home',
  ratings:saved.ratings||{},
  known:saved.known||{},
  checks:saved.checks||{},
  deck:'blå',
  card:0,
  flipped:false,
  quiz:null
};

function save() {
  try {
    localStorage.setItem(key,JSON.stringify({
      ratings:s.ratings,
      known:s.known,
      checks:s.checks
    }));
  } catch {}
}

function h(x) {
  return String(x).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function shuffle(a) {
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const learned=()=>words.filter(
  w=>w.level==='blå'&&s.known[w.id]
).length;

const ready=()=>[...techniques,...forms].filter(
  x=>s.ratings[x.id]===2
).length;

const checked=()=>exercises.reduce(
  (n,e)=>n+Array.from(
    {length:e.count},
    (_,i)=>Number(!!s.checks[e.id+i])
  ).reduce((a,b)=>a+b,0),
  0
);

function rating(x) {
  return `<div>${
    [[0,'Ikke endnu'],[1,'Øver'],[2,'Sidder ✓']]
    .map(([n,label])=>`
      <button
        class="btn ${s.ratings[x.id]===n?'chosen':'alt'}"
        data-rate="${x.id}:${n}">
        ${label}
      </button>
    `).join('')
  }</div>`;
}

function home() {
  return `
    <h2>Din træningsbase</h2>
    <p class="muted">
      Lidt træning ad gangen – det skal være sjovt!
    </p>

    <div class="grid">
      <div class="card">
        <h3>🧠 ${learned()}/6 nye teoriord</h3>
        <p>Ord du kan huske</p>
        <button class="btn" data-tab="cards">
          Øv ord
        </button>
      </div>

      <div class="card">
        <h3>🥋 ${ready()}/13 teknikker og former</h3>
        <p>Markeret som 'Sidder'</p>
        <button class="btn" data-tab="tech">
          Øv teknik
        </button>
      </div>

      <div class="card">
        <h3>✅ ${checked()}/24 øvelser</h3>
        <p>Øvet sammen med instruktør eller forælder</p>
        <button class="btn" data-tab="drills">
          Se krav
        </button>
      </div>
    </div>

    <div class="card">
      <h3>🏆 Miniprøve</h3>
      <p>
        12 spørgsmål om teori og teknikker fra 6. kup.
      </p>
      <button class="btn" data-tab="quiz">
        Start her
      </button>
    </div>

    <div class="note">
      Forslag: 3 minutter teori + 5 minutter teknikker,
      nogle gange om ugen. Nedtagninger, selvforsvar
      og kamp skal øves med kvalificeret opsyn.
    </div>
  `;
}

function deck() {
  return words.filter(
    w=>s.deck==='alle'||s.deck===w.level
  );
}

function cards() {
  const d=deck();
  const w=d[s.card%d.length];

  return `
    <h2>🧠 Flashcards</h2>
    <p>Sig betydningen, før du vender kortet.</p>

    <div>
      ${[
        ['blå','Nye ord'],
        ['grøn','Repetition'],
        ['alle','Alle']
      ].map(([v,n])=>`
        <button
          class="btn ${s.deck===v?'':'alt'}"
          data-deck="${v}">
          ${n}
        </button>
      `).join('')}
    </div>

    <div class="flash">
      <small>Kort ${s.card+1} af ${d.length}</small>
      <strong>${h(w.k)}</strong>

      ${s.flipped?`
        <p>[${h(w.p)}]</p>
        <h3>${h(w.d)}</h3>
      `:`
        <p>Hvad betyder det?</p>
      `}
    </div>

    ${s.flipped?`
      <button class="btn alt" data-know="0">
        Øv igen
      </button>
      <button class="btn" data-know="1">
        Det kunne jeg ✓
      </button>
    `:`
      <button class="btn" data-flip="1">
        Vis svaret
      </button>
    `}

    <button class="btn alt" data-next="1">
      Næste →
    </button>

    <p class="muted">
      Lært i denne gruppe:
      ${d.filter(x=>s.known[x.id]).length}/${d.length}
    </p>
  `;
}

function tech() {
  return `
    <h2>🥋 Teknikker</h2>
    <p class="muted">
      Træn ud fra de bevægelser,
      hun har lært i klubben.
    </p>

    ${[
      'Standteknikker',
      'Håndteknikker',
      'Benteknikker'
    ].map(g=>`
      <div class="card">
        <h3>${g}</h3>

        ${techniques.filter(x=>x.group===g).map(x=>`
          <div class="term">
            <h3>${h(x.k)}</h3>
            <p>${h(x.d)}</p>
            <p class="muted">
              Udtale: [${h(x.p)}]
            </p>
            ${rating(x)}
          </div>
        `).join('')}
      </div>
    `).join('')}
  `;
}

function drills() {
  return `
    <h2>✅ Praktiske øvelser</h2>

    <div class="card">
      <h3>Poomse / Hyung</h3>

      ${forms.map(f=>`
        <div class="term">
          <h3>${h(f.k)}</h3>
          ${rating(f)}
        </div>
      `).join('')}

      <p class="muted">
        Rækkefølgen i serierne står ikke
        trin for trin i pensum.
      </p>
    </div>

    ${exercises.map(e=>`
      <div class="card">
        <h3>${h(e.name)}</h3>
        <p>${h(e.desc)}</p>

        ${Array.from({length:e.count},(_,i)=>`
          <label class="check">
            <input
              type="checkbox"
              data-check="${e.id+i}"
              ${s.checks[e.id+i]?'checked':''}>
            ${e.id==='spar'?'Runde':'Øvelse'} ${i+1}
          </label>
        `).join('')}
      </div>
    `).join('')}

    <div class="note">
      Antallet er fra pensummet. De enkelte
      kampkombinationer er ikke beskrevet der,
      så listen er pladsholdere til dem,
      instruktøren lærer hende.
    </div>
  `;
}

function startQuiz() {
  const entries=[
    ...words.filter(x=>x.level==='blå'),
    ...shuffle(techniques).slice(0,6)
  ];

  s.quiz={
    qs:shuffle(entries).map(x=>{
      let pool=words.some(w=>w.id===x.id)
        ? words
        : techniques;

      let choices=shuffle([
        x.d,
        ...shuffle(
          pool.filter(y=>y.id!==x.id).map(y=>y.d)
        ).filter(y=>y!==x.d).slice(0,3)
      ]);

      return {
        q:`Hvad betyder “${x.k}”?`,
        a:x.d,
        choices
      };
    }),
    index:0,
    selected:-1,
    score:0
  };

  render();
}

function quiz() {
  if(!s.quiz) {
    return `
      <h2>🏆 Miniprøve</h2>
      <div class="card">
        <p>
          12 spørgsmål om koreanske ord og teknikker.
          Du får resultatet til sidst.
        </p>
        <button class="btn" data-start="1">
          Start prøven
        </button>
      </div>
    `;
  }

  const qz=s.quiz;

  if(qz.index===qz.qs.length) {
    return `
      <h2>🏆 Resultat</h2>
      <div class="card">
        <h2>${qz.score} ud af ${qz.qs.length} rigtige!</h2>
        <p>
          ${qz.score===12
            ? 'Fantastisk! Alle rigtige! 🌟'
            : 'Godt øvet! Du kan prøve igen, når du vil. 💪'}
        </p>
        <button class="btn" data-start="1">
          Prøv igen
        </button>
      </div>
    `;
  }

  const q=qz.qs[qz.index];

  return `
    <h2>🏆 Spørgsmål ${qz.index+1}/12</h2>

    <div class="card">
      <h3>${h(q.q)}</h3>

      ${q.choices.map((v,i)=>`
        <button
          class="option
            ${qz.selected>=0&&v===q.a?'good':''}
            ${qz.selected===i&&v!==q.a?'bad':''}"
          data-answer="${i}"
          ${qz.selected>=0?'disabled':''}>
          ${h(v)}
        </button>
      `).join('')}

      ${qz.selected>=0?`
        <p>Rigtigt svar: <b>${h(q.a)}</b></p>
        <button class="btn" data-advance="1">
          ${qz.index===11?'Se resultat':'Næste →'}
        </button>
      `:''}
    </div>
  `;
}

function render() {
  document.querySelectorAll('nav button').forEach(
    b=>b.classList.toggle(
      'on',
      b.dataset.tab===s.tab
    )
  );

  document.getElementById('progress').textContent=
    `${ready()}/13 teknikker og former sidder`;

  document.getElementById('bar').style.width=
    (ready()/13*100)+'%';

  document.getElementById('view').innerHTML=({
    home,cards,tech,drills,quiz
  })[s.tab]();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;

  const d=b.dataset;

  if(d.tab) {
    s.tab=d.tab;
    render();
    window.scrollTo(0,0);

  } else if(d.deck) {
    s.deck=d.deck;
    s.card=0;
    s.flipped=false;
    render();

  } else if(d.flip) {
    s.flipped=true;
    render();

  } else if(d.next||d.know!==undefined) {
    if(d.know!==undefined) {
      s.known[deck()[s.card].id]=d.know==='1';
      save();
    }
    s.card=(s.card+1)%deck().length;
    s.flipped=false;
    render();

  } else if(d.rate) {
    const [id,n]=d.rate.split(':');
    s.ratings[id]=Number(n);
    save();
    render();

  } else if(d.start) {
    startQuiz();

  } else if(
    d.answer!==undefined &&
    s.quiz &&
    s.quiz.selected<0
  ) {
    s.quiz.selected=Number(d.answer);

    if(
      s.quiz.qs[s.quiz.index].choices[s.quiz.selected]
      ===s.quiz.qs[s.quiz.index].a
    ) {
      s.quiz.score++;
    }
    render();

  } else if(d.advance) {
    s.quiz.index++;
    s.quiz.selected=-1;
    render();
  }
});

document.addEventListener('change',e=>{
  const el=e.target.closest('[data-check]');

  if(el) {
    s.checks[el.dataset.check]=el.checked;
    save();
    render();
  }
});

render();
</script>
</body>
</html>
